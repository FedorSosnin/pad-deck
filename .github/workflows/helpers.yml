# Builds the Pad Deck Helper apps (Mac and Windows). On a published release they're attached to it as
# Pad-Deck-Helper-Mac.zip and Pad-Deck-Helper-Windows.zip; run it by hand (Actions → Helper apps) to just build them.
name: Helper apps
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  # A release's tag must match the VERSION file: that's the version the apps and Pads report.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        if: github.event_name == 'release'
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::Release ${GITHUB_REF_NAME} but VERSION says $v. Bump VERSION first."; exit 1; }
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: call helper\windows\build.cmd && if not exist helper\windows\PadDeckHelper.exe exit 1
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path helper\windows\PadDeckHelper.exe -DestinationPath Pad-Deck-Helper-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: Pad-Deck-Helper-Windows, path: Pad-Deck-Helper-Windows.zip }
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" Pad-Deck-Helper-Windows.zip --clobber
  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: helper/build-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: Pad-Deck-Helper-Mac, path: dist/Pad-Deck-Helper-Mac.zip }
      - name: Attach to the release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Pad-Deck-Helper-Mac.zip --clobber
